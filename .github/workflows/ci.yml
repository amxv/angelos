name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      redeploy_api:
        description: Explicitly redeploy the API after passing Go CI
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            go:
              - '*.go'
              - 'internal/**'
              - 'cmd/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - 'scripts/**'
              - 'vercel.json'
              - '.vercelignore'
              - '.github/workflows/ci.yml'
              - '.github/ci-tools/**'
            api:
              - '*.go'
              - 'internal/**'
              - 'cmd/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - 'vercel.json'
              - '.vercelignore'
  go:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      ANGELOS_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.3'
          cache: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: |
          gofmt -l .
          gofmt -d .
          test -z "$(gofmt -l .)"
      - run: go test -race -cover ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  deploy-api:
    name: Deploy API
    needs: [changes, go]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.go.result == 'success' &&
      ((github.event_name == 'push' && needs.changes.outputs.api == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.redeploy_api))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: angelos-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip only if newer API inputs supersede this commit
        id: current
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'This source revision is no longer on main. Skipping deployment.'
            exit 0
          fi
          # A later docs-only push must not suppress this Go deployment.
          set +e
          git diff --quiet "$GITHUB_SHA" origin/main -- ':(top,glob)*.go' internal cmd pkg go.mod go.sum vercel.json .vercelignore
          result=$?
          set -e
          if [[ "$result" -eq 0 ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          elif [[ "$result" -eq 1 ]]; then
            echo 'Newer API sources are on main. Leaving deployment to their workflow.'
          else
            exit "$result"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: '22'
      # Install from a committed integrity-checked lockfile without lifecycle
      # scripts, before making the deployment credential available.
      - name: Install pinned Vercel CLI
        if: steps.current.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/angelos-vercel"
          cp .github/ci-tools/package.json .github/ci-tools/package-lock.json "$RUNNER_TEMP/angelos-vercel/"
          cd "$RUNNER_TEMP/angelos-vercel"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy tested Go source to API project
        if: steps.current.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_API_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          cli="$RUNNER_TEMP/angelos-vercel/node_modules/.bin/vercel"
          "$cli" deploy --prod --yes --non-interactive --meta "angelosCommit=$GITHUB_SHA" --token="$VERCEL_TOKEN"
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: bash scripts/install-gitleaks.sh "$RUNNER_TEMP/angelos-security-tools"
      - name: Verify synthetic fixtures and detection boundaries
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/angelos-security-tools/gitleaks
        run: python3 -m unittest discover -s scripts -p 'test_secret_scanning.py' -v
      - name: Scan complete fetched Git history
        run: '"$RUNNER_TEMP/angelos-security-tools/gitleaks" git . --log-opts="--all" --config .gitleaks.toml --redact --no-banner --ignore-gitleaks-allow'
